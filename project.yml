name: AlpharaDividends
options:
  bundleIdPrefix: com.alphara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO

targets:
  AlpharaDividends:
    type: application
    platform: iOS
    sources:
      - path: AlpharaDividends
    dependencies:
      - target: AlpharaDividendsWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alphara.dividends
        INFOPLIST_FILE: AlpharaDividends/Info.plist
        CODE_SIGN_ENTITLEMENTS: AlpharaDividends/AlpharaDividends.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AlpharaDividendsWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AlpharaDividendsWidget
      - path: AlpharaDividends/Models
      - path: AlpharaDividends/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alphara.dividends.widget
        INFOPLIST_FILE: AlpharaDividendsWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: AlpharaDividendsWidget/AlpharaDividendsWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  AlpharaDividendsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AlpharaDividendsTests
    dependencies:
      - target: AlpharaDividends
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alphara.dividends.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AlpharaDividends:
    build:
      targets:
        AlpharaDividends: all
    run:
      config: Debug
    test:
      targets:
        - AlpharaDividendsTests
